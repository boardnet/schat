<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>P2P Sesli & Yazılı Sohbet</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121214; color: #e1e1e6; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .container { width: 100%; max-width: 500px; background: #202024; border-radius: 8px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; font-size: 1.25rem; color: #04d361; }
    .card { background: #121214; padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 0.9rem; }
    .id-display { font-family: monospace; font-size: 1rem; color: #8257e5; word-break: break-all; }
    .controls { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 10px; background: #121214; border: 1px solid #323238; border-radius: 4px; color: #fff; outline: none; }
    input[type="text"]:focus { border-color: #8257e5; }
    button { padding: 10px 16px; border: none; border-radius: 4px; background: #8257e5; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #9466ff; }
    button.mute-btn { background: #e54242; }
    button.mute-btn:hover { background: #ff5c5c; }
    #chat-box { height: 220px; overflow-y: auto; background: #121214; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .msg { padding: 6px 10px; border-radius: 4px; max-width: 80%; font-size: 0.85rem; }
    .msg.me { background: #8257e5; align-self: flex-end; }
    .msg.peer { background: #29292e; align-self: flex-start; }
    .msg.system { align-self: center; color: #7c7c8a; font-size: 0.75rem; }
    .audio-status { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; color: #a8a8b3; }
  </style>
</head>
<body>

<div class="container">
  <h2>P2P Sesli & Yazılı Sohbet</h2>

  <div class="card">
    <div>Senin ID'n (Arkadaşına Gönder):</div>
    <div id="my-id" class="id-display">Oluşturuluyor...</div>
  </div>

  <div class="controls">
    <input type="text" id="target-id" placeholder="Arkadaşının ID'sini gir" />
    <button id="connect-btn">Bağlan ve Ara</button>
  </div>

  <div class="card audio-status">
    <span id="call-status">Ses: Bekleniyor...</span>
    <button id="mute-btn" class="mute-btn" style="display:none;">Mikrofonu Kapat</button>
  </div>

  <div id="chat-box"></div>

  <div class="controls" style="margin-bottom: 0;">
    <input type="text" id="msg-input" placeholder="Mesaj yaz..." disabled />
    <button id="send-btn" disabled>Gönder</button>
  </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script>
  let peer = null;
  let conn = null;
  let localStream = null;
  let isMuted = false;

  const myIdEl = document.getElementById('my-id');
  const targetIdInput = document.getElementById('target-id');
  const connectBtn = document.getElementById('connect-btn');
  const callStatusEl = document.getElementById('call-status');
  const muteBtn = document.getElementById('mute-btn');
  const chatBox = document.getElementById('chat-box');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const remoteAudio = document.getElementById('remote-audio');

  function addLog(text, type = 'system') {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // 1. Mikrofon izni al ve Peer nesnesini başlat
  async function init() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      callStatusEl.textContent = "Mikrofon hazır. Bağlantı bekleniyor.";
      muteBtn.style.display = "inline-block";
    } catch (err) {
      callStatusEl.textContent = "Mikrofon izni alınamadı (yalnızca yazı kullanılabilir).";
      console.warn("Mikrofon hatası:", err);
    }

    peer = new Peer();

    peer.on('open', (id) => {
      myIdEl.textContent = id;
      addLog("Sunucuya bağlandın. Kendi ID'ni paylaşabilirsin.");
    });

    // Gelen veri bağlantısı (Yazılı sohbet)
    peer.on('connection', (c) => {
      conn = c;
      setupDataConnection();
      addLog("Biri seninle bağlantı kurdu!", "system");
    });

    // Gelen sesli arama
    peer.on('call', (call) => {
      callStatusEl.textContent = "Gelen ses çağrısı bağlandı.";
      call.answer(localStream); // Kendi ses akışımızla yanıt veriyoruz
      call.on('stream', (remoteStream) => {
        remoteAudio.srcObject = remoteStream;
      });
    });

    peer.on('error', (err) => {
      addLog("Hata: " + err.type, "system");
    });
  }

  // 2. Hedef ID'ye bağlanma işlemi
  connectBtn.addEventListener('click', () => {
    const targetId = targetIdInput.value.trim();
    if (!targetId) return alert("Lütfen hedef ID girin.");

    addLog(targetId + " adresine bağlanılıyor...", "system");

    // Veri kanalı başlat
    conn = peer.connect(targetId);
    setupDataConnection();

    // Ses aramasını başlat
    if (localStream) {
      const call = peer.call(targetId, localStream);
      call.on('stream', (remoteStream) => {
        remoteAudio.srcObject = remoteStream;
        callStatusEl.textContent = "Sesli bağlantı kuruldu.";
      });
    }
  });

  // 3. Veri bağlantısı olayları (Mesajlaşma)
  function setupDataConnection() {
    conn.on('open', () => {
      addLog("Yazılı sohbet bağlantısı kuruldu.", "system");
      msgInput.disabled = false;
      sendBtn.disabled = false;
      targetIdInput.disabled = true;
      connectBtn.disabled = true;
    });

    conn.on('data', (data) => {
      addLog(data, 'peer');
    });

    conn.on('close', () => {
      addLog("Bağlantı koptu.", "system");
      msgInput.disabled = true;
      sendBtn.disabled = true;
    });
  }

  // 4. Mesaj Gönderme
  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !conn) return;

    conn.send(text);
    addLog(text, 'me');
    msgInput.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // 5. Mikrofon Susturma (Mute)
  muteBtn.addEventListener('click', () => {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      isMuted = !isMuted;
      audioTrack.enabled = !isMuted;
      muteBtn.textContent = isMuted ? "Sesi Aç" : "Mikrofonu Kapat";
      muteBtn.style.background = isMuted ? "#04d361" : "#e54242";
    }
  });

  init();
</script>
</body>
</html>
